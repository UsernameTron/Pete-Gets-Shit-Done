name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        full_suite: [true]
        include:
          - os: macos-latest
            node-version: 22
            full_suite: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        shell: bash
        run: |
          if [ "${{ matrix.full_suite }}" = "true" ]; then
            npm run test:coverage:full
          else
            npm run test:coverage
          fi

      - name: Check documentation drift
        if: matrix.full_suite && matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        shell: bash
        run: node scripts/check-doc-drift.cjs

      - name: Generate coverage report
        if: matrix.full_suite && matrix.node-version == 22
        shell: bash
        run: |
          chmod +x scripts/ci-coverage-report.sh
          scripts/ci-coverage-report.sh

      - name: Upload coverage artifact
        if: matrix.full_suite && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 30

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run governance shell tests
        run: |
          for test in governance/tests/test_*.sh; do
            echo "=== Running $(basename "$test") ==="
            bash "$test"
          done

  docs-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: |
          node scripts/validate-doc-links.cjs \
            --exclude 'tests/fixtures/doc-links/**' \
            --exclude '.claude/skills/SKILL.md' \
            --exclude '.claude/skills/dream-memory-consolidation/SKILL.md' \
            --exclude '.planning/REQUIREMENTS.md' \
            --exclude '.planning/milestones/v2.7-phases/54-automated-uat-runner/54-03-PLAN.md'
