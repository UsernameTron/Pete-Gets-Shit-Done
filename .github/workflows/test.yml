name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        full_suite: [true]
        include:
          - os: macos-latest
            node-version: 22
            full_suite: false
          - os: windows-latest
            node-version: 22
            full_suite: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        shell: bash
        run: |
          if [ "${{ matrix.full_suite }}" = "true" ]; then
            npm run test:coverage:full
          else
            npm run test:coverage
          fi

      - name: Generate coverage report
        if: matrix.full_suite && matrix.node-version == 22
        shell: bash
        run: |
          chmod +x scripts/ci-coverage-report.sh
          scripts/ci-coverage-report.sh

      - name: Upload coverage artifact
        if: matrix.full_suite && matrix.node-version == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 30

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      - name: Run governance shell tests
        run: |
          for test in governance/tests/test_*.sh; do
            echo "=== Running $(basename "$test") ==="
            bash "$test"
          done
