name: Security Scan

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prompt injection scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/prompt-injection-scan.sh
          scripts/prompt-injection-scan.sh --diff "origin/$BASE_REF"

      - name: Base64 obfuscation scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/base64-scan.sh
          scripts/base64-scan.sh --diff "origin/$BASE_REF"

      - name: Secret scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/secret-scan.sh
          scripts/secret-scan.sh --diff "origin/$BASE_REF"

      - name: Planning directory check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # .planning/ contains intentional GSD planning artifacts
          # (PROJECT.md, ROADMAP.md, STATE.md, REQUIREMENTS.md, phase plans).
          # These are committed for state persistence across sessions.
          # Only flag coverage/ runtime data that should stay gitignored.
          RUNTIME_FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD | grep '^coverage/' || true)
          if [ -n "$RUNTIME_FILES" ]; then
            echo "FAIL: coverage/ runtime data must not be committed to PRs"
            echo "The following coverage/ files were found in this PR:"
            echo "$RUNTIME_FILES"
            echo ""
            echo "Add coverage/ to your .gitignore and remove these files from the commit."
            exit 1
          fi
          echo "planning-dir-check: clean"
